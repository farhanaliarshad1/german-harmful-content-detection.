[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fakenews"
version = "1.0.0"
description = "German fake-news detection on DeFaktS: fine-tuned transformers, multi-task BERT and LLM baselines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Farhan Ali Arshad" }]
dependencies = [
  "torch>=2.1",
  "transformers>=4.46",
  "accelerate>=0.26",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
explain = ["shap>=0.46"]
dev = ["pytest>=7", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
