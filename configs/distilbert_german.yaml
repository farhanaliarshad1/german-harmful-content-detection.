# Single-task fake-news classifier on DeFaktS (German tweets)
data_path: data/fake_news.csv
text_col: text
label_col: binary_label
val_size: 0.1
test_size: 0.2
balance: class_weight          # none | class_weight | oversample (train split only)

model_name: distilbert-base-german-cased
max_length: 128

epochs: 5
batch_size: 16
learning_rate: 3.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
early_stopping_patience: 2
seed: 42

output_dir: outputs/distilbert-german-defakts
